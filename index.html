<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MAO Calculator – Offers v5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: #020617;
      border-radius: 18px;
      padding: 24px 24px 28px;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid #1f2937;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .formula {
      font-size: 0.85rem;
      color: #6b7280;
      text-align: right;
    }

    .formula span {
      color: #e5e7eb;
      font-weight: 500;
    }

    .section {
      margin-bottom: 22px;
    }

    .section-label {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .section-helper {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    .current-value {
      font-size: 0.95rem;
      font-weight: 500;
      color: #f9fafb;
    }

    .value-with-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-pill {
      border-radius: 999px;
      border: 1px solid #374151;
      background: #020617;
      padding: 3px 12px;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #e5e7eb;
      white-space: nowrap;
    }

    .mini-pill input {
      border: none;
      background: transparent;
      width: 60px;
      text-align: right;
      color: #e5e7eb;
      font-size: 0.8rem;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #111827;
      outline: none;
      margin: 10px 0 4px;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #22c55e;
      cursor: pointer;
      border: 2px solid #bbf7d0;
      box-shadow: 0 0 0 4px rgba(34,197,94,0.25);
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 4px;
    }

    .mao-card {
      margin-top: 10px;
      padding: 16px 18px;
      border-radius: 16px;
      background: radial-gradient(circle at top left, #22c55e33, transparent 55%), #020617;
      border: 1px solid #16a34a;
      text-align: center;
    }

    .mao-label {
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    .mao-value {
      font-size: 2.4rem;
      font-weight: 700;
      color: #bbf7d0;
    }

    .offers {
      font-size: 0.85rem;
      margin-top: 6px;
      text-align: left;
    }

    .summary {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .summary-item {
      flex: 1 1 45%;
    }

    .crm-summary {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed #1f2937;
    }

    .copy-btn {
      margin-top: 8px;
      background: #064e3b;
      color: #bbf7d0;
      border: 1px solid #22c55e;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div class="container">
  <div class="header">
    <div class="title">MAO Quick Calculator</div>
    <div class="formula"><span>MAO</span> = 70% of ARV − Repairs</div>
  </div>

  <!-- ARV Section -->
  <div class="section">
    <div class="section-label">
      <span>After Repair Value (ARV)</span>
      <div class="value-with-input">
        <span id="arv-display" class="current-value">$285,000</span>
        <div class="mini-pill">
          <input id="arv-input" type="number" value="285" />
          <span>k</span>
        </div>
      </div>
    </div>

    <input type="range" id="arv-slider" min="150000" max="450000" step="5000" value="285000">
  </div>

  <!-- Rehab Section -->
  <div class="section">
    <div class="section-label">
      <span>Rehab Budget</span>
      <div class="value-with-input">
        <span id="rehab-display" class="current-value">Medium · $45,000</span>
        <div class="mini-pill">
          <input id="rehab-input" type="number" value="45000" />
          <span>$</span>
        </div>
      </div>
    </div>

    <input type="range" id="rehab-slider" min="0" max="3" step="1" value="1">
  </div>

  <!-- MAO + Offers -->
  <div class="mao-card">
    <div class="mao-label">Max Allowable Offer</div>
    <div id="mao-display" class="mao-value">$154,500</div>

    <div class="offers">
      <div id="initial-offer-display">Initial offer (15% below MAO): $0</div>
      <div id="second-offer-display">Secondary offer (5% below MAO): $0</div>
    </div>
  </div>

  <!-- CRM Summary -->
  <div class="crm-summary">
    <div class="crm-label">CRM Summary</div>
    <pre id="crm-lines" style="white-space: pre-line;"></pre>
    <button id="copy-btn" class="copy-btn">Copy</button>
  </div>
</div>

<script>
const arvSlider = document.getElementById("arv-slider");
const arvInput = document.getElementById("arv-input");
const arvDisplay = document.getElementById("arv-display");

const rehabSlider = document.getElementById("rehab-slider");
const rehabInput = document.getElementById("rehab-input");
const rehabDisplay = document.getElementById("rehab-display");

const maoDisplay = document.getElementById("mao-display");
const initialOfferDisplay = document.getElementById("initial-offer-display");
const secondOfferDisplay = document.getElementById("second-offer-display");
const crmLines = document.getElementById("crm-lines");
const copyBtn = document.getElementById("copy-btn");

const rehabOptions = [
  { label: "Light", amount: 25000 },
  { label: "Medium", amount: 45000 },
  { label: "Large", amount: 65000 },
  { label: "Gut", amount: 85000 },
];

function formatCurrency(num) {
  return num.toLocaleString("en-US", {
    style: "currency",
    currency: "USD",
    maximumFractionDigits: 0,
  });
}

function update() {
  const arv = parseInt(arvSlider.value);
  const rehab = parseInt(rehabInput.value);
  const seventy = Math.round(arv * 0.7);
  const mao = Math.max(0, seventy - rehab);

  const initial = Math.round(mao * 0.85);
  const second = Math.round(mao * 0.95);

  arvDisplay.textContent = formatCurrency(arv);
  maoDisplay.textContent = formatCurrency(mao);
  initialOfferDisplay.textContent =
    "Initial offer (15% below MAO): " + formatCurrency(initial);
  secondOfferDisplay.textContent =
    "Secondary offer (5% below MAO): " + formatCurrency(second);

  const rehabLabel =
    rehabOptions.find((r) => r.amount === rehab)?.label || "Custom";

  rehabDisplay.textContent = `${rehabLabel} · ${formatCurrency(rehab)}`;

  crmLines.textContent =
    `ARV: ${formatCurrency(arv)}\n` +
    `Rehab: ${formatCurrency(rehab)}\n` +
    `MAO: ${formatCurrency(mao)}\n` +
    `Initial offer (15% below MAO): ${formatCurrency(initial)}\n` +
    `Second offer (5% below MAO): ${formatCurrency(second)}`;
}

arvSlider.addEventListener("input", () => {
  arvInput.value = Math.round(arvSlider.value / 1000);
  update();
});

arvInput.addEventListener("change", () => {
  let k = parseInt(arvInput.value);
  if (k < 150) k = 150;
  if (k > 450) k = 450;
  arvSlider.value = k * 1000;
  update();
});

rehabSlider.addEventListener("input", () => {
  rehabInput.value = rehabOptions[rehabSlider.value].amount;
  update();
});

rehabInput.addEventListener("change", update);

copyBtn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(crmLines.textContent);
    copyBtn.textContent = "Copied!";
    setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
  } catch {
    alert("Copy failed. Try manually selecting and copying.");
  }
});

update();
</script>

</body>
</html>
